plugins { id 'com.android.application' }

android {
    namespace 'com.meumercado.app'
    compileSdk 35
    defaultConfig {
        applicationId 'com.meumercado.app'
        minSdk 24
        targetSdk 34
        versionCode 2
        versionName '1.0.1-alpha'
    }
    buildTypes {
        saldoteste {
            initWith debug
            applicationIdSuffix '.saldoteste'
            versionNameSuffix '-paralelo'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
