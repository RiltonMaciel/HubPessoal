plugins { id 'com.android.application' }

android {
    namespace 'com.meumercado.app'
    compileSdk 35
    defaultConfig {
        applicationId 'com.meumercado.app'
        minSdk 24
        targetSdk 34
        versionCode 3
        versionName '1.0.2-alpha'
        manifestPlaceholders = [appLabel: 'Meu Mercado']
    }
    buildTypes {
        saldoteste {
            initWith debug
            applicationIdSuffix '.saldoteste'
            versionNameSuffix '-paralelo'
        }
        saldocorrigido {
            initWith debug
            applicationIdSuffix '.saldocorrigido'
            versionNameSuffix '-testesaldos'
            manifestPlaceholders = [appLabel: 'Meu Mercado Saldos FIX']
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
