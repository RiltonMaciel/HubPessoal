name: Meu Mercado - compilar APK
on:
  push:
    branches: [meu-mercado-android]
  pull_request:
    paths: ['apps/meu-mercado/**', '.github/workflows/build-meu-mercado.yml']
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Testes de saldos e pagamentos
        run: |
          mkdir -p /tmp/meu-mercado-test
          javac -encoding UTF-8 -d /tmp/meu-mercado-test \
            apps/meu-mercado/app/src/main/java/com/meumercado/app/BalanceMath.java \
            apps/meu-mercado/tests/com/meumercado/app/BalanceMathTest.java
          java -cp /tmp/meu-mercado-test com.meumercado.app.BalanceMathTest
          javac -encoding UTF-8 -cp /tmp/meu-mercado-test -d /tmp/meu-mercado-test \
            apps/meu-mercado/app/src/main/java/com/meumercado/app/BudgetSummary.java \
            apps/meu-mercado/tests/com/meumercado/app/BudgetSummaryTest.java
          java -cp /tmp/meu-mercado-test com.meumercado.app.BudgetSummaryTest
      - name: Verificar SDK Android
        run: ls "$ANDROID_HOME/platforms"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Compilar APK Android
        run: gradle -p apps/meu-mercado :app:assembleDebug --stacktrace --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: MeuMercado-debug-apk
          path: apps/meu-mercado/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Compilar APK de teste paralelo (sem apagar app antigo)
        run: gradle -p apps/meu-mercado :app:assembleSaldoteste --stacktrace --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: MeuMercado-saldos-teste-paralelo
          path: apps/meu-mercado/app/build/outputs/apk/saldoteste/app-saldoteste.apk
          if-no-files-found: error
      - name: Compilar APK com correção de salvar saldos sem apagar o antigo
        run: gradle -p apps/meu-mercado :app:assembleSaldocorrigido --stacktrace --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: MeuMercado-saldos-fix-v1.0.2
          path: apps/meu-mercado/app/build/outputs/apk/saldocorrigido/app-saldocorrigido.apk
          if-no-files-found: error
      - name: Compilar Meu Mercado AUTO para instalação paralela
        run: gradle -p apps/meu-mercado :app:assembleSaldosautomatico --stacktrace --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: MeuMercado-v1.0.3-Orcamento-Automatico
          path: apps/meu-mercado/app/build/outputs/apk/saldosautomatico/app-saldosautomatico.apk
          if-no-files-found: error
