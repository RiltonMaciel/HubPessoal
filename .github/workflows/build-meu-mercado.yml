name: Meu Mercado - compilar APK
on:
  push:
    branches: [meu-mercado-android]
  pull_request:
    paths: ['apps/meu-mercado/**', '.github/workflows/build-meu-mercado.yml']
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Testes de saldos e pagamentos
        run: |
          mkdir -p /tmp/meu-mercado-test
          javac -encoding UTF-8 -d /tmp/meu-mercado-test \
            apps/meu-mercado/app/src/main/java/com/meumercado/app/BalanceMath.java \
            apps/meu-mercado/tests/com/meumercado/app/BalanceMathTest.java
          java -cp /tmp/meu-mercado-test com.meumercado.app.BalanceMathTest
      - name: Verificar SDK Android
        run: ls "$ANDROID_HOME/platforms"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Compilar APK Android
        run: gradle -p apps/meu-mercado :app:assembleDebug --stacktrace --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: MeuMercado-debug-apk
          path: apps/meu-mercado/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
