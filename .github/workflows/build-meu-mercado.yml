name: Meu Mercado - compilar APK
on:
  push:
    branches: [meu-mercado-android]
  pull_request:
    paths: ['apps/meu-mercado/**', '.github/workflows/build-meu-mercado.yml']
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Compilar APK Android
        run: gradle -p apps/meu-mercado :app:assembleDebug --stacktrace --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: MeuMercado-debug-apk
          path: apps/meu-mercado/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
